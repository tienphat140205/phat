learning_rate: 0.002
lr_scheduler: StepLR
lr_step_size: 125
lr_gamma: 0.5
epochs: 500
batch_size: 128

en1_units: 100
embedding_dim: 100
dropout: 0.

pos_threshold: 0.4

temperature: 0.2
# Model architecture & core parameters
num_topic: 50       # Số lượng topic
hidden_dim: 300     # Kích thước lớp ẩn trong Encoder
dropout: 0.2        # Tỷ lệ dropout
tau: 0.75           # Nhiệt độ cho contrastive loss và tính beta
epsilon: 0.05       # Tham số cho Sinkhorn (alignment loss)

# Loss weights
lambda_contrast: 1.0  # Trọng số cho contrastive loss (dựa trên cluster)
gamma_align: 5.0      # Trọng số cho alignment loss (topic embeddings)

# Training parameters
learning_rate: 0.001
epochs: 100
align_start_epoch: 25 # Epoch bắt đầu áp dụng alignment loss

# Optional LR Scheduler (ví dụ: StepLR)
# Bỏ comment và đặt giá trị nếu muốn dùng
lr_scheduler: StepLR
lr_step_size: 30
lr_gamma: 0.5